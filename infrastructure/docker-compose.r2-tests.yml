name: rota-r2-tests
services:
  postgres:
    image: postgres:15-alpine
    container_name: rota-r2-test-postgres
    environment:
      POSTGRES_PASSWORD: r2-disposable-only
      # Compatibility name required by the existing R1 destructive-test guard.
      POSTGRES_DB: rota_r1_test
    ports: ["127.0.0.1:5540:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rota_r1_test"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: rota-r2-test-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6480:6379"]
  shard-0:
    image: postgres:15-alpine
    container_name: rota-r2-test-shard-0
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rota_r1_shard_0
    ports: ["127.0.0.1:5541:5432"]
  shard-1:
    image: postgres:15-alpine
    container_name: rota-r2-test-shard-1
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rota_r1_shard_1
    ports: ["127.0.0.1:5542:5432"]
