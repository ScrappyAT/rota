version: '3.8'

services:
  postgres_shard_0:
    image: postgres:15-alpine
    container_name: rota-postgres-shard-0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rota_shard_0
    ports:
      - "5441:5432"
    volumes:
      - postgres_shard_0_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rota_shard_0"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres_shard_1:
    image: postgres:15-alpine
    container_name: rota-postgres-shard-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rota_shard_1
    ports:
      - "5442:5432"
    volumes:
      - postgres_shard_1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rota_shard_1"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_shard_0_data:
  postgres_shard_1_data:
